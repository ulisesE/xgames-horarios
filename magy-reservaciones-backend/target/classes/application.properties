# ============================================================================
# CONFIGURACIÓN GENERAL DEL SERVIDOR (TOMCAT EMBEDDED)
# ============================================================================
server.port=8080

# ============================================================================
# CONFIGURACIÓN DE BASE DE DATOS MYSQL
# ============================================================================
# Cambia localhost:3306 por la IP y puerto de tu MySQL si es diferente.
# magy_reservaciones_db es el nombre de la base de datos creada con el script SQL.
spring.datasource.url=jdbc:mysql://localhost:3306/magy_reservaciones_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
# Coloca la contraseña de tu usuario root de MySQL aquí (por defecto suele ser vacío o root)
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ============================================================================
# update: Hibernate actualiza las tablas según las clases de Java. 
# none: No realiza cambios estructurales (usa nuestro script schema.sql de forma manual).
# Se recomienda 'update' para desarrollo inicial rápido.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================================================
# CONFIGURACIÓN DE HORA Y FORMATOS
# ============================================================================
spring.jackson.time-zone=America/Mexico_City
spring.jackson.date-format=yyyy-MM-dd

# ============================================================================
# CONFIGURACIÓN DE LOGS (OPCIONAL)
# ============================================================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.magysuite=DEBUG
