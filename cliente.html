<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pump It Up - Redirigiendo...</title>
    <meta name="theme-color" content="#0f0f1b">
    
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        /* Reset y estilos básicos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0f0f1b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .redirect-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Logo */
        .logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .neon-text-magenta { color: #ff2d95; text-shadow: 0 0 20px rgba(255, 45, 149, 0.4); }
        .neon-text-cyan { color: #00e5ff; text-shadow: 0 0 20px rgba(0, 229, 255, 0.4); }
        .neon-text-yellow { color: #ffe600; text-shadow: 0 0 20px rgba(255, 230, 0, 0.4); }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Spinner */
        .spinner {
            width: 50px;
            height: 50px;
            margin: 20px auto 30px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .redirect-message {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .redirect-message strong {
            color: #00e5ff;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0 25px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff2d95, #00e5ff, #ffe600);
            border-radius: 4px;
            animation: progress 3s ease-in-out forwards;
        }

        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .btn-redirect {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #ff2d95, #00e5ff);
            color: #0f0f1b;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Outfit', sans-serif;
        }

        .btn-redirect:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.3);
        }

        .btn-redirect:active {
            transform: scale(0.97);
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .redirect-container {
                padding: 30px 20px;
            }
            .logo {
                font-size: 1.5rem;
            }
            .redirect-message {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="redirect-container">
        <!-- Logo -->
        <div class="logo">
            <span class="neon-text-magenta">X</span>
            <span class="neon-text-cyan">GAMES</span>
            <span class="neon-text-yellow">BARCADE</span>
        </div>
        <div class="subtitle">PUMP IT UP · CLIENTES</div>

        <!-- Spinner -->
        <div class="spinner"></div>

        <!-- Mensaje -->
        <p class="redirect-message">
            🚀 Estamos mudando nuestra plataforma a una <strong>nueva versión</strong>.
        </p>
        <p class="redirect-message" style="font-size: 0.95rem; color: rgba(255,255,255,0.6);">
            Serás redirigido automáticamente en unos segundos...
        </p>

        <!-- Barra de progreso -->
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <!-- Botón manual -->
        <a href="https://magi-suite.web.app/local/biz_1786567885850" class="btn-redirect" id="redirect-btn">
            Ir ahora →
        </a>

        <p class="footer-note">
            Si no eres redirigido, haz clic en el botón.
        </p>
    </div>

    <script>
        (function() {
            // URL de destino
            const TARGET_URL = 'https://magi-suite.web.app/local/biz_1786567885850';
            
            // Tiempo de espera antes de redirigir (3 segundos)
            const REDIRECT_DELAY = 3000;

            let redirectTimeout = null;

            function performRedirect() {
                window.location.href = TARGET_URL;
            }

            // Redirigir automáticamente después del delay
            redirectTimeout = setTimeout(performRedirect, REDIRECT_DELAY);

            // El botón también redirige inmediatamente
            document.getElementById('redirect-btn').addEventListener('click', function(e) {
                e.preventDefault();
                // Cancelar el timeout para evitar doble redirección
                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                }
                performRedirect();
            });

            // Si el usuario hace clic en cualquier parte, también redirige (opcional)
            // Esto ayuda si el usuario está impaciente
            document.addEventListener('click', function() {
                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                    performRedirect();
                }
            });

            // También si presiona cualquier tecla
            document.addEventListener('keydown', function() {
                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                    performRedirect();
                }
            });

        })();
    </script>

</body>

</html>
